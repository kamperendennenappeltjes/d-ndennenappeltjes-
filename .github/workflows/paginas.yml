name: Pagina's en sitemap maken
on:
  push:
    paths:
      - 'index.html'
      - 'data/campings.js'
      - 'data/verhalen.js'
      - 'data/uitrusting.js'
      - 'data/tips.js'
      - 'data/paklijst.js'
      - 'data/over.js'
      - 'data/checklists.js'
      - 'data/instellingen.js'
      - 'data/fotos.js'
      - 'data/videos.js'
      - 'scripts/maak-paginas.mjs'
      - 'scripts/naar-webp.mjs'
      - 'img/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paginas
  cancel-in-progress: false
jobs:
  paginas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Afbeeldingen naar WebP
        run: |
          npm install --no-save --no-package-lock sharp
          node scripts/naar-webp.mjs
      - name: Pagina's maken
        run: node scripts/maak-paginas.mjs
      - name: Opslaan
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add img data/webp.js campings verhalen uitrusting paklijst tips over-ons fotos videos contact home sitemap.xml robots.txt
          git diff --cached --quiet || (git commit -m "Pagina's, sitemap en WebP bijgewerkt" && git pull --rebase -X theirs && git push)
