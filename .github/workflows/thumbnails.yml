name: Thumbnails ophalen
on:
  push:
    paths:
      - 'data/videos.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thumbnails
  cancel-in-progress: false
jobs:
  thumbs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Thumbnails downloaden
        run: |
          python3 - <<'PY'
          import re, os, urllib.request
          os.makedirs('img/thumbs', exist_ok=True)
          txt = ''
          for f in ('data/videos.js', 'data/campings.js'):
              if os.path.exists(f):
                  txt += open(f, encoding='utf-8').read() + '\n'
          ids = sorted(set(re.findall(r'(?:v=|youtu\.be/|shorts/|embed/)([\w-]{11})', txt)))
          def geldig(p):
              try:
                  b = open(p, 'rb').read()
                  return len(b) > 2000 and b[:2] == b'\xff\xd8'
              except Exception:
                  return False
          for i in ids:
              dest = f'img/thumbs/{i}.jpg'
              if geldig(dest):
                  continue
              for naam in ('maxresdefault', 'hqdefault'):
                  try:
                      urllib.request.urlretrieve(f'https://i.ytimg.com/vi/{i}/{naam}.jpg', dest)
                      if geldig(dest):
                          print('opgehaald', i, naam)
                          break
                      os.remove(dest)
                  except Exception as e:
                      print('mislukt', i, naam, e)
                      if os.path.exists(dest):
                          os.remove(dest)
          PY
      - name: Opslaan
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add img/thumbs
          git diff --cached --quiet || (git commit -m "Thumbnails bijgewerkt" && git pull --rebase && git push)
