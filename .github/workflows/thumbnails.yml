name: Thumbnails ophalen
on:
  push:
    paths:
      - 'data/videos.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Thumbnails downloaden
        run: |
          python3 - <<'PY'
          import re, os, urllib.request
          os.makedirs('img/thumbs', exist_ok=True)
          txt = open('data/videos.js', encoding='utf-8').read()
          ids = sorted(set(re.findall(r'(?:v=|youtu\.be/|shorts/|embed/)([\w-]{11})', txt)))
          for i in ids:
              dest = f'img/thumbs/{i}.jpg'
              if os.path.exists(dest):
                  continue
              try:
                  urllib.request.urlretrieve(f'https://i.ytimg.com/vi/{i}/hqdefault.jpg', dest)
                  print('opgehaald', i)
              except Exception as e:
                  print('mislukt', i, e)
          PY
      - name: Opslaan
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add img/thumbs
          git diff --cached --quiet || (git commit -m "Thumbnails bijgewerkt" && git push)
