<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Beheer</title>
<style>
:root{color-scheme:dark;--nacht:#0d1a15;--den:#17301f;--mos:#21402c;--oranje:#f08a3c;--rood:#d90f14;--room:#f6ecd6}
*{box-sizing:border-box}body{margin:0;background:var(--nacht);color:var(--room);font:17px/1.55 system-ui,sans-serif;padding:16px;padding-bottom:90px}
.w{max-width:760px;margin:0 auto}h1,h2,h3{margin:.3em 0}a{color:var(--oranje)}
.bk{background:var(--den);border-radius:16px;padding:16px;margin:14px 0;display:grid;gap:10px}
label{display:grid;gap:4px;font-weight:700}input,textarea,select{font:inherit;color:var(--room);background:var(--nacht);border:2px solid rgba(240,138,60,.5);border-radius:10px;padding:10px;width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 20px;background:var(--oranje);color:#1a0f05;cursor:pointer}button.r{background:var(--rood);color:#fff}
.t{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.t button{background:transparent;color:var(--room);border:2px solid var(--oranje)}.t button.on{background:var(--oranje);color:#1a0f05}
#toast{position:fixed;left:12px;right:12px;bottom:12px;background:var(--oranje);color:#1a0f05;font-weight:700;padding:12px;border-radius:12px;text-align:center;display:none}
button:disabled{opacity:.35;cursor:default}.mv{display:flex;gap:8px;flex-wrap:wrap}.rij{display:grid;gap:8px;background:var(--nacht);border-radius:12px;padding:12px}img.p{max-width:220px;border-radius:10px;display:block;margin-bottom:8px}small{opacity:.8;font-weight:400}
</style></head><body><div class="w" id="app"></div><div id="toast"></div>
<script>
const FILES={CAMPINGS:'data/campings.js',FOTOS:'data/fotos.js',VID:'data/videos.js',UIT:'data/uitrusting.js',PAK:'data/paklijst.js',CHK:'data/checklists.js',TIPS:'data/tips.js',VERHALEN:'data/verhalen.js',OVER:'data/over.js',INST:'data/instellingen.js'};
const DEF={CHK:()=>[{"id": "najaar", "naam": "Najaar", "tekst": "Herfstkamperen: uitgebreide checklist", "cats": [{"n": "Kleding en persoonlijke spullen", "i": ["Warme truien en vesten", "T-shirts en laagjes", "Lange broeken", "Warme pyjama's", "Extra dikke sokken", "Regenjas en regenbroek", "Waterdichte schoenen/laarzen", "Muts, sjaal en handschoenen", "Ondergoed en reservekleding", "Toilettas en medicatie", "Handdoeken en washandjes"]}, {"n": "Warm en comfortabel slapen", "i": ["Warme dekbedden", "Extra dekens of plaids", "Warme hoeslakens", "Extra kussens", "Warme slaapkleding", "Kruik voor in bed", "Dikke sokken voor de nacht", "Eventueel extra slaapzak", "Oplossing voor condens", "Zakdoekjes"]}, {"n": "Caravan en techniek", "i": ["Stroomkabel en verloopstekker", "Kabelhaspel (buiten geschikt)", "Oprijblokken en wielkeggen", "Disselslot en wielklem", "Haringen en rubberen hamer", "Waterpas", "Grondzeil of deurmat", "Zaklamp of hoofdlamp", "Batterijen en powerbank", "Basisgereedschap", "Reservezekeringen", "Handschoenen"]}, {"n": "Verwarming en veiligheid", "i": ["Verwarming controleren", "Gasinstallatie controleren", "Gasfles en aansluiting checken", "Rookmelder testen", "Koolmonoxidemelder testen", "Brandblusser of blusdeken", "EHBO-set", "Pijnstillers en pleisters", "Ventilatieopeningen vrijhouden", "Handleiding caravan", "Weersverwachting en nachtvorst"]}, {"n": "Gezelligheid in de caravan", "i": ["Warme plaids voor de bank", "Sfeerverlichting/ledlampjes", "Ledkaarsen", "Leeslampje", "Boeken en tijdschriften", "Kaart- en bordspelletjes", "Tablet met films", "Koptelefoon", "Warme huissokken", "Favoriete mokken", "Gezellige herfstdecoratie"]}, {"n": "Eten en drinken", "i": ["Koffie en thee", "Warme chocolademelk", "Soep en bouillon", "Pasta, rijst en ovenschotels", "Ontbijtproducten", "Groente en fruit", "Snacks en koekjes", "Drinkwater en thermosfles", "Olie, kruiden en sauzen", "Afwasmiddel en vaatdoekjes", "Keukenpapier en vuilniszakken"]}, {"n": "Buiten en bij regen", "i": ["Waterdichte schoenen", "Extra deurmat tegen modder", "Emmer en borstel", "Microvezeldoeken", "Waszak voor natte kleding", "Regenbestendige buitenlamp", "Stevige haringen", "Luifel controleren", "Regenwater veilig afvoeren", "Droogrekje voor binnen", "Extra vuilniszakken"]}, {"n": "Onderweg", "i": ["Rijbewijs", "Kentekenbewijs", "Verzekeringspapieren", "Identiteitsbewijzen", "Reserveringsbevestiging", "Navigatie en opladers", "Route en milieustickers", "Veiligheidsvesten", "Gevarendriehoek", "Banden en verlichting checken", "Lekkere snacks en drinken"]}, {"n": "Badkamer en schoonmaak", "i": ["Toiletpapier (caravantoilet)", "Toiletreiniger (juiste systeem)", "Toiletvloeistof (indien van toepassing)", "Handzeep", "Shampoo en douchegel", "Badslippers", "Handdoeken en washandjes", "Schoonmaakmiddel", "Microvezeldoeken", "Afvalzakjes", "Toiletborstel", "Wasmiddel indien nodig", "Extra toiletpapier"]}, {"n": "Extra aandacht voor kou en vorst", "i": ["Nachtvorst controleren", "Waterleidingen beschermen", "Watersysteem aftappen (indien nodig)", "Gas- en stroomvoorraad checken", "Condens dagelijks verwijderen", "Ventileren, ook bij koud weer", "Natte schoenen laten drogen", "Geen barbecue/kooktoestel binnen", "Buitenspullen veilig opbergen", "Luifel bij harde wind afbreken"]}]}],FOTOS:()=>({"Eerder": [{"src": "img/foto-4.jpg", "tekst": "Camping vanuit de lucht in de avond"}, {"src": "img/foto-8.jpg", "tekst": "Auto en caravan"}, {"src": "img/foto-9.jpg", "tekst": "Caravan in de sneeuw"}, {"src": "img/foto-1.jpg", "tekst": "Verlichte voortenten"}, {"src": "img/foto-10.jpg", "tekst": "Kampeerplek van boven"}, {"src": "img/foto-5.jpg", "tekst": "Gezin bij de westernhut"}, {"src": "img/foto-11.jpg", "tekst": "Twee kinderen op het gras"}, {"src": "img/foto-7.jpg", "tekst": "Twee kampeerders bij de caravans"}]}),VID:()=>[],TIPS:()=>[{"titel":"Plan je vertrek","tekst":"Maak een vaste checklist voor vertrek en aankomst. Dan vergeet je niets en staat alles sneller."},{"titel":"Verlichting maakt de plek","tekst":"Ledstrips langs de dakrand van de voortent geven sfeer en je vindt 's avonds je weg."},{"titel":"Een vloer onder de voortent","tekst":"Zo blijft het schoon en droog, ook na regen."},{"titel":"Kamperen met kinderen","tekst":"Neem spelletjes mee en zoek een camping met speelruimte. Dan genieten ook de ouders."},{"titel":"Fietsen mee","tekst":"Een fietsendrager op de caravandissel spaart ruimte in de auto en je ontdekt de omgeving."},{"titel":"Winters kamperen","tekst":"Goed isoleren, verwarming op orde en sneeuw tijdig van het dak vegen."}],VERHALEN:()=>[{"titel":"Een avond vol kleur","tekst":"De hele rij voortenten licht op. Gezien vanuit de lucht zie je pas hoe mooi het is.","foto":"img/foto-4.jpg"},{"titel":"Een dag naar het pretpark","tekst":"Even weg van de camping met het hele gezin, en in het westernstadje op de foto.","foto":"img/foto-5.jpg"},{"titel":"Boven de boomtoppen","tekst":"Een toren beklimmen en uitkijken over het bos: ons favoriete uitje onderweg.","foto":"img/foto-6.jpg"}],OVER:()=>({"kop":"Wij zijn d'n Dennenappeltjes","tekst":["Wij zijn een kampeergezin uit Brabant. Met onze Hobby-caravan trekken we er zo vaak mogelijk op uit, in elk seizoen, ook als er sneeuw ligt.","Op ons YouTube-kanaal nemen we je mee naar de camping. Op deze site vind je alles wat we onderweg leren: wat we meenemen, wat werkt en waar het fijn is."],"foto":"img/foto-3.jpg","alt":"Ons gezin op een uitkijktoren boven het bos"})};
const INSTDEF={hero:'img/foto-1.jpg',contact:'img/foto-7.jpg'};DEF.INST=()=>({...INSTDEF});
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const lines=t=>t.split('\n').map(x=>x.trim()).filter(Boolean),slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'camping';
let cfg=JSON.parse(localStorage.getItem('gh')||'{}'),D={},sha={},orig={},prev={},tab='Campings',lastMap='',lastPlek='',fv={map:null,plek:null};
function toast(t){const m=$('#toast');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',8000)}
const b64=s=>btoa(unescape(encodeURIComponent(s))),unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function gh(path,opt={}){const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`+(opt.method?'':'?ref='+(cfg.branch||'main')),{...opt,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});const j=await r.json();if(!r.ok)throw new Error(j.message||r.status);return j}
function setup(){$('#app').innerHTML=`<h1>Beheer</h1><p>Eenmalig instellen. Dit blijft alleen in deze browser op dit apparaat.</p><div class="bk"><label>GitHub-gebruikersnaam<input id="o" value="${esc(cfg.owner)}"></label><label>Naam van de repository<input id="r" value="${esc(cfg.repo)}"></label><label>Token<input id="k" type="password" value="${esc(cfg.token)}"><small>Fine-grained token met alleen deze repository en rechten Contents: Read and write.</small></label><button id="go">Opslaan en starten</button></div>`;
$('#go').onclick=()=>{cfg={owner:$('#o').value.trim(),repo:$('#r').value.trim(),token:$('#k').value.trim(),branch:'main'};localStorage.setItem('gh',JSON.stringify(cfg));start()}}
async function start(){$('#app').innerHTML='<p>Laden...</p>';try{for(const[k,f]of Object.entries(FILES)){let j;try{j=await gh(f)}catch(e){if(DEF[k]&&/not found/i.test(e.message)){D[k]=DEF[k]();orig[k]=JSON.stringify(D[k]);continue}throw e}sha[k]=j.sha;D[k]=new Function(unb64(j.content)+';return '+k)();if(k=='VID')D[k]=D[k].filter(v=>v&&!Array.isArray(v)&&v.url);orig[k]=JSON.stringify(D[k])}W.PAK=Object.entries(D.PAK).map(([n,a])=>({n,i:a.slice()}));W.UIT=Object.entries(D.UIT).map(([n,o])=>({n,r:Object.entries(o).map(([x,t])=>({n:x,t:typeof t=='string'?t:(t&&t.t)||'',p:(t&&typeof t=='object'?t.p||[]:[]).map(q=>({...q}))}))}));draw()}catch(e){toast('Laden mislukte: '+e.message);setup()}}
let uv={c:null,r:null};const W={PAK:[],UIT:[]},LIST=a=>a=='PAK'||a=='UIT'?W[a]:D[a],NEW={TIPS:()=>({titel:'',tekst:''}),VERHALEN:()=>({titel:'',tekst:'',lang:'',foto:'',fotos:[]}),PAK:()=>({n:'',i:[]}),UIT:()=>({n:'',r:[{n:'',t:'',p:[]}]})};
function sync(){const P={},U={};W.PAK.forEach(c=>{if(c.n)P[c.n]=c.i});W.UIT.forEach(c=>{if(c.n){U[c.n]={};c.r.forEach(x=>{if(x.n){const p=(x.p||[]).filter(q=>q.n||q.url||q.foto||q.code);U[c.n][x.n]=p.length?{t:x.t,p}:x.t}})}});D.PAK=P;D.UIT=U}
const ctl=(i,n)=>`<div class="mv"><button data-mv="-1" ${i==0?'disabled':''}>&uarr; Omhoog</button><button data-mv="1" ${i==n-1?'disabled':''}>&darr; Omlaag</button><button class="r" data-del>Verwijderen</button></div>`;
const F=(k,l,v,ta)=>`<label>${l}${ta?`<textarea data-k="${k}" rows="${ta}">${esc(v)}</textarea>`:`<input data-k="${k}" value="${esc(v)}">`}</label>`;
const SEL=(k,l,v)=>`<label>${l}<select data-k="${k}">${['','Ja','Nee'].map(o=>`<option ${o==(v||'')?'selected':''}>${o}</option>`).join('')}</select></label>`;
const TABS=[['Campings','Campings'],['Verhalen','Verhalen'],['Tips','Tips'],['Over','Over ons'],['Fotos',"Foto's"],['Videos',"Video's"],['Uitrusting','Uitrusting'],['Paklijst','Paklijst'],['Checklists','Uitgebreide lijsten'],['Achtergrond',"Site-foto's"],['Statistieken','Statistieken']];
const pl=()=>[...new Set([...D.CAMPINGS.map(c=>c.naam),...jr().flatMap(k=>D.FOTOS[k]).map(p=>p.camping)].filter(Boolean))];
const jr=()=>{const ks=Object.keys(D.FOTOS).filter(k=>k.slice(0,2)!='__'),o=Array.isArray(D.FOTOS.__orde)?D.FOTOS.__orde:[];return [...o.filter(k=>ks.includes(k)),...ks.filter(k=>!o.includes(k)).sort((a,b)=>b.localeCompare(a,'nl',{numeric:true}))]};
const pko=m=>{const ks=[...new Set((D.FOTOS[m]||[]).map(x=>x.camping||''))],o=(D.FOTOS.__plekken&&D.FOTOS.__plekken[m])||[];return [...new Set(o)].filter(k=>ks.includes(k)).concat(ks.filter(k=>!o.includes(k)).sort((a,c)=>a.localeCompare(c,'nl')))};
function draw(){let h=`<h1>Beheer <small>versie 19</small></h1><div class="t">${TABS.map(([k,l])=>`<button data-t="${k}" class="${k==tab?'on':''}">${l}</button>`).join('')}<button data-s style="margin-left:auto">Instellingen</button></div>`;
if(tab=='Campings')h+=D.CAMPINGS.map((c,i,A)=>`<div class="bk" data-i="${i}"><h3>${esc(c.naam)||'Nieuwe camping'}</h3><div class="mv"><button data-cmv="-1" ${i==0?'disabled':''}>&uarr; Omhoog</button><button data-cmv="1" ${i==A.length-1?'disabled':''}>&darr; Omlaag</button></div>${F('naam','Naam',c.naam)}${F('plaats','Plaats',c.plaats)}${F('type','Soort (Camping, Vakantiepark...)',c.type)}${F('plaatsnr','Plaatsnummer',c.plaatsnr)}${F('stroom','Stroom (ampère)',c.stroom)}${F('opp','Oppervlakte van de plaats (m²)',c.opp)}${SEL('water','Water op de plaats',c.water)}${SEL('afvoer','Afvoer op de plaats',c.afvoer)}${F('cijfer','Cijfer',c.cijfer)}${F('url','Website',c.url)}${F('tekst','Tekst',c.tekst,4)}${F('plus','Dit vonden we fijn (een per regel)',(c.plus||[]).join('\n'),3)}${F('min','Dit kan beter (een per regel)',(c.min||[]).join('\n'),3)}${F('info','Overige feiten, per regel Naam: waarde',Object.entries(c.info||{}).map(([k,v])=>k+': '+v).join('\n'),4)}${c.foto?`<img class="p" src="${esc(prev[c.foto]||c.foto)}">`:''}<label>Hoofdfoto kiezen<input type="file" accept="image/*" data-f></label><button class="r" data-d>Verwijderen</button></div>`).join('')+'<button data-n>Camping toevoegen</button>';
else if(tab=='Fotos')h+=fotoView();
else if(tab=='Videos')h+=`<p>Plak de YouTube-link van een video (watch, youtu.be of shorts). Een nieuwe video komt bovenaan te staan. Met de pijlknoppen zet je een video hoger of lager.</p><p><button data-vn>Video toevoegen</button></p>`+D.VID.map((v,i)=>`<div class="bk" data-v="${i}">${F('titel','Titel',v.titel)}${F('url','YouTube-link',v.url)}<div class="mv"><button data-vm="-1" ${i==0?'disabled':''}>&uarr; Omhoog</button><button data-vm="1" ${i==D.VID.length-1?'disabled':''}>&darr; Omlaag</button><button class="r" data-vd>Verwijderen</button></div></div>`).join('');
else if(tab=='Verhalen')h+=`<p>Verhalen van jullie avonturen, met een foto. De korte tekst staat in het blokje op de pagina Verhalen. Schrijf je ook een uitgebreid verhaal, dan komt er in het blokje een knop Lees meer die naar een eigen pagina met het hele verhaal gaat. Een nieuwe alinea begin je op een nieuwe regel.</p>`+D.VERHALEN.map((v,i)=>`<div class="bk" data-a="VERHALEN" data-i="${i}">${F('titel','Titel',v.titel)}${F('tekst','Korte tekst (staat in het blokje op de site)',v.tekst,4)}${F('lang','Uitgebreid verhaal (komt achter Lees meer op een eigen pagina; laat leeg als er geen Lees meer moet komen). Nieuw blok met kopje: begin de regel met ## . Foto naast de tekst van dat blok: zet [foto 1] op een eigen regel. Rij foto\'s binnen het blok, onder de tekst: zet [fotos 2, 9-11, 13] op een eigen regel. Losse rij foto\'s tussen de blokken: zet [rij 2, 9-11, 13] op een eigen regel. Twee blokken naast elkaar: zet [naast] op een eigen regel tussen die twee blokken.',v.lang,16)}${vfotos(v)}${v.foto?`<img class="p" src="${esc(prev[v.foto]||v.foto)}">`:''}<label>Foto kiezen${v.foto?' (vervangt de huidige)':''}<input type="file" accept="image/*" data-vf></label>${v.foto?'<button data-nofoto style="background:transparent;border:2px solid var(--oranje);color:var(--room)">Foto weghalen</button>':''}<button data-pv style="background:transparent;border:2px solid var(--oranje);color:var(--room);justify-self:start">Voorbeeld bekijken</button>${ctl(i,D.VERHALEN.length)}</div>`).join('')+'<button data-add="VERHALEN">Verhaal toevoegen</button>';
else if(tab=='Tips')h+=`<p>De tips op de pagina Tips. Pas ze aan, zet ze in een andere volgorde of voeg er een toe.</p>`+D.TIPS.map((t,i)=>`<div class="bk" data-a="TIPS" data-i="${i}">${F('titel','Titel',t.titel)}${F('tekst','Tekst',t.tekst,3)}${ctl(i,D.TIPS.length)}</div>`).join('')+'<button data-add="TIPS">Tip toevoegen</button>';
else if(tab=='Over'){const o=D.OVER;h+=`<p>Het verhaal over jullie op de pagina Over ons.</p><div class="bk" data-a="OVER">${F('kop','Kop',o.kop)}${F('tekst','Tekst (elke alinea op een eigen regel)',(o.tekst||[]).join('\n'),9)}<h3>Foto 1</h3>${o.foto?`<img class="p" src="${esc(prev[o.foto]||o.foto)}">`:''}<label>Foto kiezen${o.foto?' (vervangt de huidige)':''}<input type="file" accept="image/*" data-of></label>${F('alt','Beschrijving van foto 1',o.alt)}${o.foto?'<button data-ofx="foto" style="background:transparent;border:2px solid var(--oranje);color:var(--room)">Foto 1 weghalen</button>':''}<h3>Foto 2</h3>${o.foto2?`<img class="p" src="${esc(prev[o.foto2]||o.foto2)}">`:''}<label>Foto kiezen${o.foto2?' (vervangt de huidige)':''}<input type="file" accept="image/*" data-of2></label>${F('alt2','Beschrijving van foto 2',o.alt2)}${o.foto2?'<button data-ofx="foto2" style="background:transparent;border:2px solid var(--oranje);color:var(--room)">Foto 2 weghalen</button>':''}</div>`}
else if(tab=='Paklijst')h+=`<p>Elke categorie is een blok op de pagina Wat neem je mee. Zet bij elke categorie een item per regel.</p>`+W.PAK.map((c,i)=>`<div class="bk" data-a="PAK" data-i="${i}"><label>Categorie<input data-cn value="${esc(c.n)}"></label><label>Wat gaat er mee (een per regel)<textarea data-ci rows="${Math.max(5,c.i.length+1)}">${esc(c.i.join('\n'))}</textarea></label>${ctl(i,W.PAK.length)}</div>`).join('')+'<button data-add="PAK">Categorie toevoegen</button>';
else if(tab=='Checklists')h+=ckView();
else if(tab=='Achtergrond')h+=instView();else if(tab=='Statistieken')h+=statView();else h+=uitView();
h+='<p><button data-save style="font-size:1.1rem">Opslaan en publiceren</button></p>';$('#app').innerHTML=h;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{read();tab=b.dataset.t;draw()});$('[data-s]').onclick=setup;
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{read();if(confirm('Verwijderen?')){D.CAMPINGS.splice(+b.closest('.bk').dataset.i,1);draw()}});
document.querySelectorAll('[data-fd]').forEach(b=>b.onclick=()=>{read();const r=b.closest('[data-j]');D.FOTOS[r.dataset.j].splice(+r.dataset.i,1);if(!D.FOTOS[r.dataset.j].length)delete D.FOTOS[r.dataset.j];draw()});
document.querySelectorAll('[data-vd]').forEach(b=>b.onclick=()=>{read();D.VID.splice(+b.closest('.bk').dataset.v,1);draw()});
document.querySelectorAll('[data-vm]').forEach(x=>x.onclick=()=>{read();const i=+x.closest('.bk').dataset.v,j=i+ +x.dataset.vm;if(j<0||j>=D.VID.length)return;[D.VID[i],D.VID[j]]=[D.VID[j],D.VID[i]];draw()});
const vn=$('[data-vn]');if(vn)vn.onclick=()=>{read();D.VID.unshift({titel:'',url:''});draw()};
document.querySelectorAll('[data-cmv]').forEach(x=>x.onclick=()=>{read();const i=+x.closest('.bk').dataset.i,j=i+ +x.dataset.cmv;if(j<0||j>=D.CAMPINGS.length)return;[D.CAMPINGS[i],D.CAMPINGS[j]]=[D.CAMPINGS[j],D.CAMPINGS[i]];draw();const k=document.querySelectorAll('.bk')[j];if(k)k.scrollIntoView({block:'center'})});
const n=$('[data-n]');if(n)n.onclick=()=>{read();D.CAMPINGS.push({id:'',naam:'',plaats:'',type:'Camping',cijfer:'',tekst:'',info:{}});draw()};
document.querySelectorAll('[data-f]').forEach(inp=>inp.onchange=()=>photo(inp));
document.querySelectorAll('[data-mv]').forEach(x=>x.onclick=()=>{read();const k=x.closest('.bk'),i=+k.dataset.i,j=i+ +x.dataset.mv,L=LIST(k.dataset.a);if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];sync();draw()});
document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{read();const k=x.closest('.bk');if(confirm('Verwijderen?')){LIST(k.dataset.a).splice(+k.dataset.i,1);sync();draw()}});

const gcc=()=>localStorage.getItem('gcCode')||'dennenappeltjes',gct=()=>localStorage.getItem('gcTok')||'';
function statView(){if(!gct())return `<h2>Statistieken</h2><p>Hiermee zie je hoeveel bezoekers je site heeft en welke pagina's en producten het meest bekeken worden. Eenmalig instellen:</p><ol><li>Maak een gratis account op <b>goatcounter.com</b> met de naam <b>dennenappeltjes</b> (de naam is straks het adres dennenappeltjes.goatcounter.com).</li><li>Klik rechtsboven op je naam, kies <b>API</b> en maak een sleutel met leesrechten voor de statistieken.</li><li>Plak de sleutel hieronder. Hij blijft alleen in deze browser staan.</li></ol><div class="bk"><label>Naam bij GoatCounter<input id="gcc" value="${esc(gcc())}"></label><label>API-sleutel<input id="gct" type="password"></label><button id="gcs">Opslaan</button></div>`;
return `<h2>Statistieken</h2><p><select id="stp"><option value="1">Vandaag</option><option value="7" selected>Laatste 7 dagen</option><option value="30">Laatste 30 dagen</option><option value="365">Laatste jaar</option></select> <a href="https://${esc(gcc())}.goatcounter.com" target="_blank" rel="noopener">Volledig dashboard</a></p><div id="stbody">Laden...</div><p><button id="stx" style="${GH}">Instellingen wijzigen</button></p>`}
function statRows(a,nm){const m=Math.max(1,...a.map(h=>h.n));return a.length?a.map(h=>`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;gap:10px"><span>${esc(nm(h.p))}</span><b>${h.n}</b></div><div style="height:8px;border-radius:4px;background:var(--oranje);width:${Math.max(3,h.n/m*100)}%"></div></div>`).join(''):'<p>Nog niets te zien.</p>'}
async function loadStats(){const bd=$('#stbody');if(!bd)return;const n=+$('#stp').value,end=new Date(),st=new Date(end-n*864e5);if(n==1)st.setHours(0,0,0,0);
const q=`start=${encodeURIComponent(st.toISOString())}&end=${encodeURIComponent(end.toISOString())}`,o={headers:{Authorization:'Bearer '+gct()}},base=`https://${gcc()}.goatcounter.com/api/v0/stats`;
try{const [t,p]=await Promise.all([fetch(`${base}/total?${q}`,o),fetch(`${base}/hits?${q}&limit=100`,o)]);if(!t.ok||!p.ok)throw new Error('status '+(t.ok?p.status:t.status));
const T=await t.json(),P=await p.json(),H=(P.hits||[]).map(h=>({p:h.path||'',n:h.count||h.count_unique||0,e:!!h.event})).sort((a,c)=>c.n-a.n);
const pg=H.filter(h=>!h.e),kl=H.filter(h=>h.e&&/^\/?klik\//.test(h.p)),cd=H.filter(h=>h.e&&/^\/?code\//.test(h.p));
const pn=p=>{p=p.replace(/^\//,'')||'home';return p.charAt(0).toUpperCase()+p.slice(1)};
bd.innerHTML=`<div class="bk"><h3>${T.total||0}</h3><small>bezoeken in deze periode</small></div><h3>Meest bekeken pagina's</h3>${statRows(pg,pn)}<h3>Klikken op "Bekijk / koop"</h3>${statRows(kl,p=>p.replace(/^\/?klik\//,''))}<h3>Gekopieerde kortingscodes</h3>${statRows(cd,p=>p.replace(/^\/?code\//,''))}`}
catch(e){bd.innerHTML=`<p>Laden lukte niet (${esc(e.message)}). Controleer de naam en de sleutel via Instellingen wijzigen, of bekijk de cijfers in het <a href="https://${esc(gcc())}.goatcounter.com" target="_blank" rel="noopener">GoatCounter-dashboard</a>.</p>`}}

const x=$('#stx');if(x)x.onclick=()=>{localStorage.removeItem('gcTok');draw()};const p=$('#stp');if(p){p.onchange=loadStats;loadStats()}}

function vlang(v){const fo=Array.isArray(v.fotos)?v.fotos:[],used={},B=[],nb=()=>({kop:'',p:[],f:null,rows:[]});let c=nb();
const push=()=>{if(c.kop||c.p.length||c.f!=null||c.rows.length)B.push(c);c=nb()};
const take=g=>{const r=[],add=n=>{if(n>=0&&fo[n]&&fo[n].src&&!used[n]){used[n]=1;r.push(n)}};g.replace(/\s*[-\u2013]\s*/g,'-').split(/[\s,;]+/).forEach(t=>{let m;if(m=t.match(/^(\d+)-(\d+)$/)){let a=+m[1],b=+m[2];if(a<=b){b=Math.min(b,fo.length);for(let n=a;n<=b;n++)add(n-1)}else{a=Math.min(a,fo.length);for(let n=a;n>=b;n--)add(n-1)}}else if(/^\d+$/.test(t))add(t-1)});return r};
String(v.lang||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>{let m;
if(m=x.match(/^\[(foto|fotos|rij)\s*([\d\s,;\-\u2013]+)\]$/i)){const k=m[1].toLowerCase(),g=m[2].trim();
if(k=='foto'&&/^\d+$/.test(g)){const n=g-1;if(fo[n]&&fo[n].src&&!used[n]){used[n]=1;if(c.f!=null)push();c.f=n}}
else{const r=take(g);if(r.length){

else if(c.kop||c.p.length||c.f!=null||c.rows.length)c.rows.push(r);
else B.push({car:r,kop:''})}}}
else if(/^\[naast\]$/i.test(x)){push();if(B.length&&!B[B.length-1].car)B[B.length-1].duo=1}
else if(m=x.match(/^##(?:\s+(.*))?$/)){push();c.kop=(m[1]||'').trim()}
else c.p.push(x)});
push();
