<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Beheer</title>
<style>
:root{color-scheme:dark;--nacht:#0d1a15;--den:#17301f;--mos:#21402c;--oranje:#f08a3c;--rood:#d90f14;--room:#f6ecd6}
*{box-sizing:border-box}body{margin:0;background:var(--nacht);color:var(--room);font:17px/1.55 system-ui,sans-serif;padding:16px;padding-bottom:90px}
.w{max-width:760px;margin:0 auto}h1,h2,h3{margin:.3em 0}a{color:var(--oranje)}
.bk{background:var(--den);border-radius:16px;padding:16px;margin:14px 0;display:grid;gap:10px}
label{display:grid;gap:4px;font-weight:700}input,textarea,select{font:inherit;color:var(--room);background:var(--nacht);border:2px solid rgba(240,138,60,.5);border-radius:10px;padding:10px;width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 20px;background:var(--oranje);color:#1a0f05;cursor:pointer}button.r{background:var(--rood);color:#fff}
.t{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.t button{background:transparent;color:var(--room);border:2px solid var(--oranje)}.t button.on{background:var(--oranje);color:#1a0f05}
#toast{position:fixed;left:12px;right:12px;bottom:12px;background:var(--oranje);color:#1a0f05;font-weight:700;padding:12px;border-radius:12px;text-align:center;display:none}
button:disabled{opacity:.35;cursor:default}.mv{display:flex;gap:8px;flex-wrap:wrap}.rij{display:grid;gap:8px;background:var(--nacht);border-radius:12px;padding:12px}img.p{max-width:220px;border-radius:10px;display:block;margin-bottom:8px}small{opacity:.8;font-weight:400}
</style></head><body><div class="w" id="app"></div><div id="toast"></div>
<script>
const FILES={CAMPINGS:'data/campings.js',FOTOS:'data/fotos.js',VID:'data/videos.js',UIT:'data/uitrusting.js',PAK:'data/paklijst.js',TIPS:'data/tips.js',VERHALEN:'data/verhalen.js',OVER:'data/over.js'};
const DEF={FOTOS:()=>({"Eerder": [{"src": "img/foto-4.jpg", "tekst": "Camping vanuit de lucht in de avond"}, {"src": "img/foto-8.jpg", "tekst": "Auto en caravan"}, {"src": "img/foto-9.jpg", "tekst": "Caravan in de sneeuw"}, {"src": "img/foto-1.jpg", "tekst": "Verlichte voortenten"}, {"src": "img/foto-10.jpg", "tekst": "Kampeerplek van boven"}, {"src": "img/foto-5.jpg", "tekst": "Gezin bij de westernhut"}, {"src": "img/foto-11.jpg", "tekst": "Twee kinderen op het gras"}, {"src": "img/foto-7.jpg", "tekst": "Twee kampeerders bij de caravans"}]}),VID:()=>[],TIPS:()=>[{"titel":"Plan je vertrek","tekst":"Maak een vaste checklist voor vertrek en aankomst. Dan vergeet je niets en staat alles sneller."},{"titel":"Verlichting maakt de plek","tekst":"Ledstrips langs de dakrand van de voortent geven sfeer en je vindt 's avonds je weg."},{"titel":"Een vloer onder de voortent","tekst":"Zo blijft het schoon en droog, ook na regen."},{"titel":"Kamperen met kinderen","tekst":"Neem spelletjes mee en zoek een camping met speelruimte. Dan genieten ook de ouders."},{"titel":"Fietsen mee","tekst":"Een fietsendrager op de caravandissel spaart ruimte in de auto en je ontdekt de omgeving."},{"titel":"Winters kamperen","tekst":"Goed isoleren, verwarming op orde en sneeuw tijdig van het dak vegen."}],VERHALEN:()=>[{"titel":"Een avond vol kleur","tekst":"De hele rij voortenten licht op. Gezien vanuit de lucht zie je pas hoe mooi het is.","foto":"img/foto-4.jpg"},{"titel":"Een dag naar het pretpark","tekst":"Even weg van de camping met het hele gezin, en in het westernstadje op de foto.","foto":"img/foto-5.jpg"},{"titel":"Boven de boomtoppen","tekst":"Een toren beklimmen en uitkijken over het bos: ons favoriete uitje onderweg.","foto":"img/foto-6.jpg"}],OVER:()=>({"kop":"Wij zijn d'n Dennenappeltjes","tekst":["Wij zijn een kampeergezin uit Brabant. Met onze Hobby-caravan trekken we er zo vaak mogelijk op uit, in elk seizoen, ook als er sneeuw ligt.","Op ons YouTube-kanaal nemen we je mee naar de camping. Op deze site vind je alles wat we onderweg leren: wat we meenemen, wat werkt en waar het fijn is."],"foto":"img/foto-3.jpg","alt":"Ons gezin op een uitkijktoren boven het bos"})};
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const lines=t=>t.split('\n').map(x=>x.trim()).filter(Boolean),slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'camping';
let cfg=JSON.parse(localStorage.getItem('gh')||'{}'),D={},sha={},orig={},prev={},tab='Campings',lastMap='',lastPlek='',fv={map:null,plek:null};
function toast(t){const m=$('#toast');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',8000)}
const b64=s=>btoa(unescape(encodeURIComponent(s))),unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function gh(path,opt={}){const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`+(opt.method?'':'?ref='+(cfg.branch||'main')),{...opt,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});const j=await r.json();if(!r.ok)throw new Error(j.message||r.status);return j}
function setup(){$('#app').innerHTML=`<h1>Beheer</h1><p>Eenmalig instellen. Dit blijft alleen in deze browser op dit apparaat.</p><div class="bk"><label>GitHub-gebruikersnaam<input id="o" value="${esc(cfg.owner)}"></label><label>Naam van de repository<input id="r" value="${esc(cfg.repo)}"></label><label>Token<input id="k" type="password" value="${esc(cfg.token)}"><small>Fine-grained token met alleen deze repository en rechten Contents: Read and write.</small></label><button id="go">Opslaan en starten</button></div>`;
$('#go').onclick=()=>{cfg={owner:$('#o').value.trim(),repo:$('#r').value.trim(),token:$('#k').value.trim(),branch:'main'};localStorage.setItem('gh',JSON.stringify(cfg));start()}}
async function start(){$('#app').innerHTML='<p>Laden...</p>';try{for(const[k,f]of Object.entries(FILES)){let j;try{j=await gh(f)}catch(e){if(DEF[k]&&/not found/i.test(e.message)){D[k]=DEF[k]();orig[k]=JSON.stringify(D[k]);continue}throw e}sha[k]=j.sha;D[k]=new Function(unb64(j.content)+';return '+k)();if(k=='VID')D[k]=D[k].filter(v=>v&&!Array.isArray(v)&&v.url);orig[k]=JSON.stringify(D[k])}W.PAK=Object.entries(D.PAK).map(([n,a])=>({n,i:a.slice()}));W.UIT=Object.entries(D.UIT).map(([n,o])=>({n,r:Object.entries(o).map(([x,t])=>({n:x,t}))}));draw()}catch(e){toast('Laden mislukte: '+e.message);setup()}}
const W={PAK:[],UIT:[]},LIST=a=>a=='PAK'||a=='UIT'?W[a]:D[a],NEW={TIPS:()=>({titel:'',tekst:''}),VERHALEN:()=>({titel:'',tekst:'',foto:''}),PAK:()=>({n:'',i:[]}),UIT:()=>({n:'',r:[{n:'',t:''}]})};
function sync(){const P={},U={};W.PAK.forEach(c=>{if(c.n)P[c.n]=c.i});W.UIT.forEach(c=>{if(c.n){U[c.n]={};c.r.forEach(x=>{if(x.n)U[c.n][x.n]=x.t})}});D.PAK=P;D.UIT=U}
const ctl=(i,n)=>`<div class="mv"><button data-mv="-1" ${i==0?'disabled':''}>&uarr; Omhoog</button><button data-mv="1" ${i==n-1?'disabled':''}>&darr; Omlaag</button><button class="r" data-del>Verwijderen</button></div>`;
const F=(k,l,v,ta)=>`<label>${l}${ta?`<textarea data-k="${k}" rows="${ta}">${esc(v)}</textarea>`:`<input data-k="${k}" value="${esc(v)}">`}</label>`;
const SEL=(k,l,v)=>`<label>${l}<select data-k="${k}">${['','Ja','Nee'].map(o=>`<option ${o==(v||'')?'selected':''}>${o}</option>`).join('')}</select></label>`;
const TABS=[['Campings','Campings'],['Verhalen','Verhalen'],['Tips','Tips'],['Over','Over ons'],['Fotos',"Foto's"],['Videos',"Video's"],['Uitrusting','Uitrusting'],['Paklijst','Paklijst']];
const pl=()=>[...new Set([...D.CAMPINGS.map(c=>c.naam),...jr().flatMap(k=>D.FOTOS[k]).map(p=>p.camping)].filter(Boolean))];
const jr=()=>{const ks=Object.keys(D.FOTOS).filter(k=>k!='__orde'),o=Array.isArray(D.FOTOS.__orde)?D.FOTOS.__orde:[];return [...o.filter(k=>ks.includes(k)),...ks.filter(k=>!o.includes(k)).sort((a,b)=>b.localeCompare(a,'nl',{numeric:true}))]};
function draw(){let h=`<h1>Beheer <small>versie 8</small></h1><div class="t">${TABS.map(([k,l])=>`<button data-t="${k}" class="${k==tab?'on':''}">${l}</button>`).join('')}<button data-s style="margin-left:auto">Instellingen</button></div>`;
if(tab=='Campings')h+=D.CAMPINGS.map((c,i)=>`<div class="bk" data-i="${i}"><h3>${esc(c.naam)||'Nieuwe camping'}</h3>${F('naam','Naam',c.naam)}${F('plaats','Plaats',c.plaats)}${F('type','Soort (Camping, Vakantiepark...)',c.type)}${F('plaatsnr','Plaatsnummer',c.plaatsnr)}${F('stroom','Stroom (ampère)',c.stroom)}${F('opp','Oppervlakte van de plaats (m²)',c.opp)}${SEL('water','Water op de plaats',c.water)}${SEL('afvoer','Afvoer op de plaats',c.afvoer)}${F('cijfer','Cijfer',c.cijfer)}${F('url','Website',c.url)}${F('tekst','Tekst',c.tekst,4)}${F('plus','Dit vonden we fijn (een per regel)',(c.plus||[]).join('\n'),3)}${F('min','Dit kan beter (een per regel)',(c.min||[]).join('\n'),3)}${F('info','Overige feiten, per regel Naam: waarde',Object.entries(c.info||{}).map(([k,v])=>k+': '+v).join('\n'),4)}${c.foto?`<img class="p" src="${esc(prev[c.foto]||c.foto)}">`:''}<label>Hoofdfoto kiezen<input type="file" accept="image/*" data-f></label><button class="r" data-d>Verwijderen</button></div>`).join('')+'<button data-n>Camping toevoegen</button>';
else if(tab=='Fotos')h+=fotoView();
else if(tab=='Videos')h+=`<p>Plak de YouTube-link van een video (watch, youtu.be of shorts). Een nieuwe video komt bovenaan te staan. Met de pijlknoppen zet je een video hoger of lager.</p><p><button data-vn>Video toevoegen</button></p>`+D.VID.map((v,i)=>`<div class="bk" data-v="${i}">${F('titel','Titel',v.titel)}${F('url','YouTube-link',v.url)}<div class="mv"><button data-vm="-1" ${i==0?'disabled':''}>&uarr; Omhoog</button><button data-vm="1" ${i==D.VID.length-1?'disabled':''}>&darr; Omlaag</button><button class="r" data-vd>Verwijderen</button></div></div>`).join('');
else if(tab=='Verhalen')h+=`<p>Verhalen van jullie avonturen, met een foto. De foto's en teksten komen op de pagina Verhalen. Een nieuwe alinea begin je op een nieuwe regel.</p>`+D.VERHALEN.map((v,i)=>`<div class="bk" data-a="VERHALEN" data-i="${i}">${F('titel','Titel',v.titel)}${F('tekst','Het verhaal',v.tekst,7)}${v.foto?`<img class="p" src="${esc(prev[v.foto]||v.foto)}">`:''}<label>Foto kiezen${v.foto?' (vervangt de huidige)':''}<input type="file" accept="image/*" data-vf></label>${v.foto?'<button data-nofoto style="background:transparent;border:2px solid var(--oranje);color:var(--room)">Foto weghalen</button>':''}${ctl(i,D.VERHALEN.length)}</div>`).join('')+'<button data-add="VERHALEN">Verhaal toevoegen</button>';
else if(tab=='Tips')h+=`<p>De tips op de pagina Tips. Pas ze aan, zet ze in een andere volgorde of voeg er een toe.</p>`+D.TIPS.map((t,i)=>`<div class="bk" data-a="TIPS" data-i="${i}">${F('titel','Titel',t.titel)}${F('tekst','Tekst',t.tekst,3)}${ctl(i,D.TIPS.length)}</div>`).join('')+'<button data-add="TIPS">Tip toevoegen</button>';
else if(tab=='Over'){const o=D.OVER;h+=`<p>Het verhaal over jullie op de pagina Over ons.</p><div class="bk" data-a="OVER">${F('kop','Kop',o.kop)}${F('tekst','Tekst (elke alinea op een eigen regel)',(o.tekst||[]).join('\n'),9)}<h3>Foto 1</h3>${o.foto?`<img class="p" src="${esc(prev[o.foto]||o.foto)}">`:''}<label>Foto kiezen${o.foto?' (vervangt de huidige)':''}<input type="file" accept="image/*" data-of></label>${F('alt','Beschrijving van foto 1',o.alt)}${o.foto?'<button data-ofx="foto" style="background:transparent;border:2px solid var(--oranje);color:var(--room)">Foto 1 weghalen</button>':''}<h3>Foto 2</h3>${o.foto2?`<img class="p" src="${esc(prev[o.foto2]||o.foto2)}">`:''}<label>Foto kiezen${o.foto2?' (vervangt de huidige)':''}<input type="file" accept="image/*" data-of2></label>${F('alt2','Beschrijving van foto 2',o.alt2)}${o.foto2?'<button data-ofx="foto2" style="background:transparent;border:2px solid var(--oranje);color:var(--room)">Foto 2 weghalen</button>':''}</div>`}
else if(tab=='Paklijst')h+=`<p>Elke categorie is een blok op de pagina Wat nemen we mee. Zet bij elke categorie een item per regel.</p>`+W.PAK.map((c,i)=>`<div class="bk" data-a="PAK" data-i="${i}"><label>Categorie<input data-cn value="${esc(c.n)}"></label><label>Wat gaat er mee (een per regel)<textarea data-ci rows="${Math.max(5,c.i.length+1)}">${esc(c.i.join('\n'))}</textarea></label>${ctl(i,W.PAK.length)}</div>`).join('')+'<button data-add="PAK">Categorie toevoegen</button>';
else h+=`<p>Elke categorie is een knop op de pagina Uitrusting. Daarin zet je de onderdelen met de spullen erbij.</p>`+W.UIT.map((c,i)=>`<div class="bk" data-a="UIT" data-i="${i}"><label>Categorie<input data-cn value="${esc(c.n)}"></label>${c.r.map((x,j)=>`<div class="rij" data-rj="${j}"><label>Onderdeel<input data-rn value="${esc(x.n)}"></label><label>Spullen (met komma's ertussen)<textarea data-rt rows="3">${esc(x.t)}</textarea></label><button class="r" data-rd style="justify-self:start;padding:8px 14px">Onderdeel verwijderen</button></div>`).join('')}<button data-ra style="justify-self:start">Onderdeel toevoegen</button>${ctl(i,W.UIT.length)}</div>`).join('')+'<button data-add="UIT">Categorie toevoegen</button>';
h+='<p><button data-save style="font-size:1.1rem">Opslaan en publiceren</button></p>';$('#app').innerHTML=h;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{read();tab=b.dataset.t;draw()});$('[data-s]').onclick=setup;
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{read();if(confirm('Verwijderen?')){D.CAMPINGS.splice(+b.closest('.bk').dataset.i,1);draw()}});
document.querySelectorAll('[data-fd]').forEach(b=>b.onclick=()=>{read();const r=b.closest('[data-j]');D.FOTOS[r.dataset.j].splice(+r.dataset.i,1);if(!D.FOTOS[r.dataset.j].length)delete D.FOTOS[r.dataset.j];draw()});
document.querySelectorAll('[data-vd]').forEach(b=>b.onclick=()=>{read();D.VID.splice(+b.closest('.bk').dataset.v,1);draw()});
document.querySelectorAll('[data-vm]').forEach(x=>x.onclick=()=>{read();const i=+x.closest('.bk').dataset.v,j=i+ +x.dataset.vm;if(j<0||j>=D.VID.length)return;[D.VID[i],D.VID[j]]=[D.VID[j],D.VID[i]];draw()});
const vn=$('[data-vn]');if(vn)vn.onclick=()=>{read();D.VID.unshift({titel:'',url:''});draw()};
const n=$('[data-n]');if(n)n.onclick=()=>{read();D.CAMPINGS.push({id:'',naam:'',plaats:'',type:'Camping',cijfer:'',tekst:'',info:{}});draw()};
document.querySelectorAll('[data-f]').forEach(inp=>inp.onchange=()=>photo(inp));
document.querySelectorAll('[data-mv]').forEach(x=>x.onclick=()=>{read();const k=x.closest('.bk'),i=+k.dataset.i,j=i+ +x.dataset.mv,L=LIST(k.dataset.a);if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];sync();draw()});
document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{read();const k=x.closest('.bk');if(confirm('Verwijderen?')){LIST(k.dataset.a).splice(+k.dataset.i,1);sync();draw()}});
document.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{read();LIST(x.dataset.add).push(NEW[x.dataset.add]());sync();draw()});
document.querySelectorAll('[data-ra]').forEach(x=>x.onclick=()=>{read();W.UIT[+x.closest('.bk').dataset.i].r.push({n:'',t:''});draw()});
document.querySelectorAll('[data-rd]').forEach(x=>x.onclick=()=>{read();W.UIT[+x.closest('.bk').dataset.i].r.splice(+x.closest('.rij').dataset.rj,1);sync();draw()});
document.querySelectorAll('[data-nofoto]').forEach(x=>x.onclick=()=>{read();D.VERHALEN[+x.closest('.bk').dataset.i].foto='';draw()});
document.querySelectorAll('[data-vf]').forEach(inp=>inp.onchange=async()=>{read();const v=D.VERHALEN[+inp.closest('.bk').dataset.i],f=inp.files[0];if(!f)return;toast('Foto uploaden...');try{v.foto=await prep(f,'img/verhalen/'+slug(v.titel||'verhaal')+'-'+Date.now()+'.jpg','Foto verhaal');draw();toast('Foto staat erin. Kies nog Opslaan en publiceren.')}catch(e){toast('Foto uploaden mislukte: '+e.message)}});
document.querySelectorAll('[data-of]').forEach(inp=>inp.onchange=async()=>{read();const f=inp.files[0];if(!f)return;toast('Foto uploaden...');try{D.OVER.foto=await prep(f,'img/over-ons-'+Date.now()+'.jpg','Foto over ons');draw();toast('Foto staat erin. Kies nog Opslaan en publiceren.')}catch(e){toast('Foto uploaden mislukte: '+e.message)}});
document.querySelectorAll('[data-of2]').forEach(inp=>inp.onchange=async()=>{read();const f=inp.files[0];if(!f)return;toast('Foto uploaden...');try{D.OVER.foto2=await prep(f,'img/over-ons-2-'+Date.now()+'.jpg','Foto 2 over ons');draw();toast('Foto staat erin. Kies nog Opslaan en publiceren.')}catch(e){toast('Foto uploaden mislukte: '+e.message)}});
document.querySelectorAll('[data-ofx]').forEach(x=>x.onclick=()=>{read();D.OVER[x.dataset.ofx]='';draw()});
const fu=$('#fup');if(fu)fu.onchange=()=>fotoUp([...fu.files]);wireF();$('[data-save]').onclick=save}
async function prep(f,path,msg){const png=f.type=='image/png';if(png)path=path.replace(/\.jpg$/,'.png');const bm=await createImageBitmap(f),r=Math.min(1,1400/bm.width),cv=document.createElement('canvas');cv.width=Math.round(bm.width*r);cv.height=Math.round(bm.height*r);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);const url=png?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',.8);
await gh(path,{method:'PUT',body:JSON.stringify({message:msg,content:url.split(',')[1],branch:cfg.branch||'main'})});prev[path]=url;return path}
async function photo(inp){read();const c=D.CAMPINGS[+inp.closest('.bk').dataset.i],f=inp.files[0];if(!f)return;if(!c.naam){toast('Vul eerst een naam in.');return}toast('Foto uploaden...');
try{c.foto=await prep(f,'img/'+slug(c.naam)+'-'+Date.now()+'.jpg','Foto '+c.naam);draw();toast('Foto staat erin. Kies nog Opslaan en publiceren.')}catch(e){toast('Foto uploaden mislukte: '+e.message)}}
function fotoView(){const m=fv.map,p=fv.plek;if(m!=null&&!D.FOTOS[m])fv={map:null,plek:null};
const bb=(t,a)=>`<p><button data-fb="${a}" style="background:transparent;border:2px solid var(--oranje);color:var(--room)">&larr; ${t}</button></p>`;
if(fv.map==null)return `<p>Kies een map (bijvoorbeeld een jaar), of maak een nieuwe. Een nieuwe map komt bovenaan te staan. Met de pijlknoppen zet je een map hoger of lager.</p>`+jr().map((j,i,A)=>`<div class="bk" data-fm="${esc(j)}" style="cursor:pointer;border:2px solid var(--oranje)"><h3>${esc(j)}</h3><small>${D.FOTOS[j].length} foto's</small><div class="mv"><button data-fmv="-1" ${i==0?'disabled':''}>&uarr; Omhoog</button><button data-fmv="1" ${i==A.length-1?'disabled':''}>&darr; Omlaag</button></div></div>`).join('')+`<div class="bk"><h3>Nieuwe map</h3><label>Naam (bijvoorbeeld 2027)<input id="nm" value="${new Date().getFullYear()}"></label><button id="nmb">Map maken</button></div>`;
const L=D.FOTOS[m];
if(p==null){const g={};L.forEach(x=>g[x.camping||'']=(g[x.camping||'']||0)+1);return bb('Alle mappen','all')+`<h2>${esc(m)}</h2><p>Kies een plek (camping, pretpark...) of maak een nieuwe.</p>`+Object.keys(g).sort((a,c)=>a.localeCompare(c,'nl')).map(k=>`<div class="bk" data-fp="${esc(k)}" style="cursor:pointer;border:2px solid var(--oranje)"><h3>${esc(k||'Algemeen (zonder plek)')}</h3><small>${g[k]} foto's</small></div>`).join('')+`<div class="bk"><h3>Nieuwe plek</h3><label>Naam (bijvoorbeeld Bobbejaanland)<input id="np" list="pl"></label><datalist id="pl">${pl().map(x=>`<option value="${esc(x)}">`).join('')}</datalist><button id="npb">Plek maken</button><button data-fp="" style="background:transparent;border:2px solid var(--oranje);color:var(--room)">Foto's zonder plek</button></div>`}
return bb(m,'map')+`<h2>${esc(m)}: ${esc(p||'Algemeen')}</h2><div class="bk"><label>Foto's toevoegen (meerdere mag)<input type="file" id="fup" accept="image/*" multiple></label>${p?'<button id="rn" style="background:transparent;border:2px solid var(--oranje);color:var(--room)">Plek hernoemen</button>':''}</div>`+L.map((x,i)=>(x.camping||'')==p?`<div data-j="${esc(m)}" data-i="${i}" style="display:flex;gap:10px;align-items:center;margin:8px 0"><img class="p" style="width:80px;height:60px;object-fit:cover;margin:0;flex:none" src="${esc(prev[x.src]||x.src)}"><input data-c style="flex:1;min-width:120px" value="${esc(x.tekst)}" placeholder="Omschrijving"><button class="r" data-fd style="padding:8px 14px">X</button></div>`:'').join('')}
function wireF(){document.querySelectorAll('[data-fmv]').forEach(x=>x.onclick=e=>{e.stopPropagation();const o=jr(),k=x.closest('[data-fm]').dataset.fm,i=o.indexOf(k),j=i+ +x.dataset.fmv;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];D.FOTOS.__orde=o;draw()});
document.querySelectorAll('[data-fm]').forEach(e=>e.onclick=()=>{fv={map:e.dataset.fm,plek:null};draw()});
document.querySelectorAll('[data-fp]').forEach(e=>e.onclick=()=>{fv.plek=e.dataset.fp;draw()});
document.querySelectorAll('[data-fb]').forEach(e=>e.onclick=()=>{read();fv=e.dataset.fb=='map'?{map:fv.map,plek:null}:{map:null,plek:null};draw()});
const a=$('#nmb');if(a)a.onclick=()=>{const v=$('#nm').value.trim();if(!v||v=='__orde')return;if(!D.FOTOS[v]){const o=jr();D.FOTOS[v]=[];D.FOTOS.__orde=[v,...o]}fv={map:v,plek:null};draw()};
const c=$('#npb');if(c)c.onclick=()=>{const v=$('#np').value.trim();if(!v)return;fv.plek=v;draw()};
const r=$('#rn');if(r)r.onclick=()=>{const v=(prompt('Nieuwe naam voor deze plek',fv.plek)||'').trim();if(!v)return;read();D.FOTOS[fv.map].forEach(x=>{if((x.camping||'')==fv.plek)x.camping=v});fv.plek=v;draw()}}
async function fotoUp(files){read();const m=fv.map,p=fv.plek||'',dir='img/fotos/'+slug(m)+(p?'/'+slug(p):'');let n=0;
for(const f of files){toast('Foto '+(++n)+' van '+files.length+' uploaden...');try{const path=await prep(f,dir+'/'+Date.now()+'-'+n+'.jpg','Foto '+m+(p?' '+p:''));(D.FOTOS[m]=D.FOTOS[m]||[]).push(p?{src:path,tekst:'',camping:p}:{src:path,tekst:''})}catch(e){toast('Uploaden mislukte: '+e.message);break}}
draw();toast('Klaar. Kies nog Opslaan en publiceren.')}
function read(){if(tab=='Campings')document.querySelectorAll('.bk').forEach(b=>{const c=D.CAMPINGS[+b.dataset.i],g=k=>$('[data-k='+k+']',b).value;c.naam=g('naam').trim();c.plaats=g('plaats').trim();c.type=g('type').trim()||'Camping';c.plaatsnr=g('plaatsnr').trim();c.stroom=g('stroom').trim();c.opp=g('opp').trim();c.water=g('water');c.afvoer=g('afvoer');const cj=g('cijfer').trim();c.cijfer=cj===''?'':isNaN(+cj.replace(',','.'))?cj:+cj.replace(',','.');c.url=g('url').trim();c.tekst=g('tekst').trim();c.plus=lines(g('plus'));c.min=lines(g('min'));c.info={};lines(g('info')).forEach(l=>{const j=l.indexOf(':');if(j>0)c.info[l.slice(0,j).trim()]=l.slice(j+1).trim()});if(!c.id)c.id=slug(c.naam)});
else if(tab=='Fotos')document.querySelectorAll('[data-j]').forEach(r=>{D.FOTOS[r.dataset.j][+r.dataset.i].tekst=$('[data-c]',r).value.trim()});
else if(tab=='Videos')document.querySelectorAll('[data-v]').forEach(b=>{const v=D.VID[+b.dataset.v];v.titel=$('[data-k=titel]',b).value.trim();v.url=$('[data-k=url]',b).value.trim()});
else if(tab=='Verhalen'||tab=='Tips'){const A=tab=='Tips'?'TIPS':'VERHALEN';document.querySelectorAll('.bk[data-a]').forEach(k=>{const x=D[A][+k.dataset.i];if(!x)return;x.titel=$('[data-k=titel]',k).value.trim();x.tekst=$('[data-k=tekst]',k).value.trim()})}
else if(tab=='Over'){const k=$('.bk[data-a=OVER]');if(k){const o=D.OVER;o.kop=$('[data-k=kop]',k).value.trim();o.tekst=lines($('[data-k=tekst]',k).value);o.alt=$('[data-k=alt]',k).value.trim();o.alt2=$('[data-k=alt2]',k).value.trim()}}
else if(tab=='Paklijst'){document.querySelectorAll('.bk[data-a=PAK]').forEach(k=>{const c=W.PAK[+k.dataset.i];c.n=$('[data-cn]',k).value.trim();c.i=lines($('[data-ci]',k).value)});sync()}
else if(tab=='Uitrusting'){document.querySelectorAll('.bk[data-a=UIT]').forEach(k=>{const c=W.UIT[+k.dataset.i];c.n=$('[data-cn]',k).value.trim();c.r=[...k.querySelectorAll('.rij')].map(r=>({n:$('[data-rn]',r).value.trim(),t:$('[data-rt]',r).value.trim()}))});sync()}}
async function save(){read();D.CAMPINGS=D.CAMPINGS.filter(c=>c.naam);sync();D.TIPS=D.TIPS.filter(t=>t.titel||t.tekst);D.VERHALEN=D.VERHALEN.filter(v=>v.titel||v.tekst);D.VID=D.VID.filter(v=>v.url);Object.keys(D.FOTOS).forEach(k=>{if(!D.FOTOS[k].length)delete D.FOTOS[k]});if(D.FOTOS.__orde)D.FOTOS.__orde=jr();toast('Bezig met opslaan...');let n=0;
try{for(const[k,f]of Object.entries(FILES)){const s=JSON.stringify(D[k]);if(s==orig[k])continue;const j=await gh(f,{method:'PUT',body:JSON.stringify({message:'Aangepast via beheer: '+f,content:b64('const '+k+'='+JSON.stringify(D[k],null,1)+';\n'),sha:sha[k],branch:cfg.branch||'main'})});sha[k]=j.content.sha;orig[k]=s;n++}toast(n?'Opgeslagen. Na ongeveer een minuut staat het op de site.':'Er was niets gewijzigd.')}catch(e){toast('Opslaan mislukte: '+e.message)}}
cfg.token?start():setup();
</script></body></html>
