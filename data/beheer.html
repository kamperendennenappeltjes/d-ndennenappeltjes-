<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Beheer</title>
<style>
:root{color-scheme:dark;--nacht:#0d1a15;--den:#17301f;--mos:#21402c;--oranje:#f08a3c;--rood:#d90f14;--room:#f6ecd6}
*{box-sizing:border-box}body{margin:0;background:var(--nacht);color:var(--room);font:17px/1.55 system-ui,sans-serif;padding:16px;padding-bottom:90px}
.w{max-width:760px;margin:0 auto}h1,h2,h3{margin:.3em 0}a{color:var(--oranje)}
.bk{background:var(--den);border-radius:16px;padding:16px;margin:14px 0;display:grid;gap:10px}
label{display:grid;gap:4px;font-weight:700}input,textarea,select{font:inherit;color:var(--room);background:var(--nacht);border:2px solid rgba(240,138,60,.5);border-radius:10px;padding:10px;width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 20px;background:var(--oranje);color:#1a0f05;cursor:pointer}button.r{background:var(--rood);color:#fff}
.t{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.t button{background:transparent;color:var(--room);border:2px solid var(--oranje)}.t button.on{background:var(--oranje);color:#1a0f05}
#toast{position:fixed;left:12px;right:12px;bottom:12px;background:var(--oranje);color:#1a0f05;font-weight:700;padding:12px;border-radius:12px;text-align:center;display:none}
img.p{max-width:220px;border-radius:10px;display:block;margin-bottom:8px}small{opacity:.8;font-weight:400}
</style></head><body><div class="w" id="app"></div><div id="toast"></div>
<script>
const FILES={CAMPINGS:'data/campings.js',FOTOS:'data/fotos.js',VID:'data/videos.js',UIT:'data/uitrusting.js',PAK:'data/paklijst.js'};
const DEF={FOTOS:()=>({"Eerder": [{"src": "img/foto-4.jpg", "tekst": "Camping vanuit de lucht in de avond"}, {"src": "img/foto-8.jpg", "tekst": "Auto en caravan"}, {"src": "img/foto-9.jpg", "tekst": "Caravan in de sneeuw"}, {"src": "img/foto-1.jpg", "tekst": "Verlichte voortenten"}, {"src": "img/foto-10.jpg", "tekst": "Kampeerplek van boven"}, {"src": "img/foto-5.jpg", "tekst": "Gezin bij de westernhut"}, {"src": "img/foto-11.jpg", "tekst": "Twee kinderen op het gras"}, {"src": "img/foto-7.jpg", "tekst": "Twee kampeerders bij de caravans"}]}),VID:()=>[]};
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const lines=t=>t.split('\n').map(x=>x.trim()).filter(Boolean),slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'camping';
let cfg=JSON.parse(localStorage.getItem('gh')||'{}'),D={},sha={},orig={},prev={},tab='Campings';
function toast(t){const m=$('#toast');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',8000)}
const b64=s=>btoa(unescape(encodeURIComponent(s))),unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function gh(path,opt={}){const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`+(opt.method?'':'?ref='+(cfg.branch||'main')),{...opt,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});const j=await r.json();if(!r.ok)throw new Error(j.message||r.status);return j}
function setup(){$('#app').innerHTML=`<h1>Beheer</h1><p>Eenmalig instellen. Dit blijft alleen in deze browser op dit apparaat.</p><div class="bk"><label>GitHub-gebruikersnaam<input id="o" value="${esc(cfg.owner)}"></label><label>Naam van de repository<input id="r" value="${esc(cfg.repo)}"></label><label>Token<input id="k" type="password" value="${esc(cfg.token)}"><small>Fine-grained token met alleen deze repository en rechten Contents: Read and write.</small></label><button id="go">Opslaan en starten</button></div>`;
$('#go').onclick=()=>{cfg={owner:$('#o').value.trim(),repo:$('#r').value.trim(),token:$('#k').value.trim(),branch:'main'};localStorage.setItem('gh',JSON.stringify(cfg));start()}}
async function start(){$('#app').innerHTML='<p>Laden...</p>';try{for(const[k,f]of Object.entries(FILES)){let j;try{j=await gh(f)}catch(e){if(DEF[k]&&/not found/i.test(e.message)){D[k]=DEF[k]();orig[k]=JSON.stringify(D[k]);continue}throw e}sha[k]=j.sha;D[k]=new Function(unb64(j.content)+';return '+k)();if(k=='VID')D[k]=D[k].filter(v=>v&&!Array.isArray(v)&&v.url);orig[k]=JSON.stringify(D[k])}draw()}catch(e){toast('Laden mislukte: '+e.message);setup()}}
const F=(k,l,v,ta)=>`<label>${l}${ta?`<textarea data-k="${k}" rows="${ta}">${esc(v)}</textarea>`:`<input data-k="${k}" value="${esc(v)}">`}</label>`;
const SEL=(k,l,v)=>`<label>${l}<select data-k="${k}">${['','Ja','Nee'].map(o=>`<option ${o==(v||'')?'selected':''}>${o}</option>`).join('')}</select></label>`;
const TABS=[['Campings','Campings'],['Fotos',"Foto's"],['Videos',"Video's"],['Uitrusting','Uitrusting'],['Paklijst','Paklijst']];
const jr=()=>Object.keys(D.FOTOS).sort((a,b)=>b.localeCompare(a,'nl',{numeric:true}));
function draw(){let h=`<h1>Beheer</h1><div class="t">${TABS.map(([k,l])=>`<button data-t="${k}" class="${k==tab?'on':''}">${l}</button>`).join('')}<button data-s style="margin-left:auto">Instellingen</button></div>`;
if(tab=='Campings')h+=D.CAMPINGS.map((c,i)=>`<div class="bk" data-i="${i}"><h3>${esc(c.naam)||'Nieuwe camping'}</h3>${F('naam','Naam',c.naam)}${F('plaats','Plaats',c.plaats)}${F('type','Soort (Camping, Vakantiepark...)',c.type)}${F('plaatsnr','Plaatsnummer',c.plaatsnr)}${F('stroom','Stroom (ampère)',c.stroom)}${F('opp','Oppervlakte van de plaats (m²)',c.opp)}${SEL('water','Water op de plaats',c.water)}${SEL('afvoer','Afvoer op de plaats',c.afvoer)}${F('cijfer','Cijfer',c.cijfer)}${F('url','Website',c.url)}${F('tekst','Tekst',c.tekst,4)}${F('plus','Dit vonden we fijn (een per regel)',(c.plus||[]).join('\n'),3)}${F('min','Dit kan beter (een per regel)',(c.min||[]).join('\n'),3)}${F('info','Overige feiten, per regel Naam: waarde',Object.entries(c.info||{}).map(([k,v])=>k+': '+v).join('\n'),4)}${c.foto?`<img class="p" src="${esc(prev[c.foto]||c.foto)}">`:''}<label>Hoofdfoto kiezen<input type="file" accept="image/*" data-f></label><button class="r" data-d>Verwijderen</button></div>`).join('')+'<button data-n>Camping toevoegen</button>';
else if(tab=='Fotos')h+=`<div class="bk"><h3>Foto's toevoegen</h3><label>Map (bijvoorbeeld 2026)<input id="jaar" list="jl" value="${new Date().getFullYear()}"></label><datalist id="jl">${jr().map(j=>`<option value="${esc(j)}">`).join('')}</datalist><label>Foto's kiezen (meerdere mag)<input type="file" id="fup" accept="image/*" multiple></label><small>Staat de map er nog niet? Typ gewoon een nieuwe naam, dan wordt hij aangemaakt.</small></div>`+jr().map(j=>`<div class="bk"><h3>${esc(j)} <small>(${D.FOTOS[j].length})</small></h3>${D.FOTOS[j].map((p,i)=>`<div data-j="${esc(j)}" data-i="${i}" style="display:flex;gap:10px;align-items:center"><img class="p" style="width:80px;height:60px;object-fit:cover;margin:0;flex:none" src="${esc(prev[p.src]||p.src)}"><input data-c value="${esc(p.tekst)}" placeholder="Omschrijving"><button class="r" data-fd style="padding:8px 14px">X</button></div>`).join('')}</div>`).join('');
else if(tab=='Videos')h+=`<p>Plak de YouTube-link van een video (watch, youtu.be of shorts).</p>`+D.VID.map((v,i)=>`<div class="bk" data-v="${i}">${F('titel','Titel',v.titel)}${F('url','YouTube-link',v.url)}<button class="r" data-vd>Verwijderen</button></div>`).join('')+'<button data-vn>Video toevoegen</button>';
else{const U=tab=='Uitrusting';h+=`<p>${U?'Een regel per onderdeel: <b>Categorie | Onderdeel | spullen met komma\'s ertussen</b>':'Een regel per item: <b>Groep | Item</b>'}</p><textarea id="ta" rows="24">${esc(Object.entries(U?D.UIT:D.PAK).flatMap(([c,s])=>U?Object.entries(s).map(([n,t])=>c+' | '+n+' | '+t):s.map(x=>c+' | '+x)).join('\n'))}</textarea>`}
h+='<p><button data-save style="font-size:1.1rem">Opslaan en publiceren</button></p>';$('#app').innerHTML=h;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{read();tab=b.dataset.t;draw()});$('[data-s]').onclick=setup;
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{read();if(confirm('Verwijderen?')){D.CAMPINGS.splice(+b.closest('.bk').dataset.i,1);draw()}});
document.querySelectorAll('[data-fd]').forEach(b=>b.onclick=()=>{read();const r=b.closest('[data-j]');D.FOTOS[r.dataset.j].splice(+r.dataset.i,1);if(!D.FOTOS[r.dataset.j].length)delete D.FOTOS[r.dataset.j];draw()});
document.querySelectorAll('[data-vd]').forEach(b=>b.onclick=()=>{read();D.VID.splice(+b.closest('.bk').dataset.v,1);draw()});
const vn=$('[data-vn]');if(vn)vn.onclick=()=>{read();D.VID.push({titel:'',url:''});draw()};
const n=$('[data-n]');if(n)n.onclick=()=>{read();D.CAMPINGS.push({id:'',naam:'',plaats:'',type:'Camping',cijfer:'',tekst:'',info:{}});draw()};
document.querySelectorAll('[data-f]').forEach(inp=>inp.onchange=()=>photo(inp));
const fu=$('#fup');if(fu)fu.onchange=()=>fotoUp([...fu.files]);$('[data-save]').onclick=save}
async function prep(f,path,msg){const bm=await createImageBitmap(f),r=Math.min(1,1400/bm.width),cv=document.createElement('canvas');cv.width=Math.round(bm.width*r);cv.height=Math.round(bm.height*r);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);const url=cv.toDataURL('image/jpeg',.8);
await gh(path,{method:'PUT',body:JSON.stringify({message:msg,content:url.split(',')[1],branch:cfg.branch||'main'})});prev[path]=url;return path}
async function photo(inp){read();const c=D.CAMPINGS[+inp.closest('.bk').dataset.i],f=inp.files[0];if(!f)return;if(!c.naam){toast('Vul eerst een naam in.');return}toast('Foto uploaden...');
try{c.foto=await prep(f,'img/'+slug(c.naam)+'-'+Date.now()+'.jpg','Foto '+c.naam);draw();toast('Foto staat erin. Kies nog Opslaan en publiceren.')}catch(e){toast('Foto uploaden mislukte: '+e.message)}}
async function fotoUp(files){read();const j=($('#jaar').value.trim())||String(new Date().getFullYear()),dir=slug(j);let n=0;
for(const f of files){toast('Foto '+(++n)+' van '+files.length+' uploaden...');try{const p=await prep(f,'img/fotos/'+dir+'/'+Date.now()+'-'+n+'.jpg','Foto '+j);(D.FOTOS[j]=D.FOTOS[j]||[]).push({src:p,tekst:''})}catch(e){toast('Uploaden mislukte: '+e.message);break}}
draw();toast('Klaar. Kies nog Opslaan en publiceren.')}
function read(){if(tab=='Campings')document.querySelectorAll('.bk').forEach(b=>{const c=D.CAMPINGS[+b.dataset.i],g=k=>$('[data-k='+k+']',b).value;c.naam=g('naam').trim();c.plaats=g('plaats').trim();c.type=g('type').trim()||'Camping';c.plaatsnr=g('plaatsnr').trim();c.stroom=g('stroom').trim();c.opp=g('opp').trim();c.water=g('water');c.afvoer=g('afvoer');const cj=g('cijfer').trim();c.cijfer=cj===''?'':isNaN(+cj.replace(',','.'))?cj:+cj.replace(',','.');c.url=g('url').trim();c.tekst=g('tekst').trim();c.plus=lines(g('plus'));c.min=lines(g('min'));c.info={};lines(g('info')).forEach(l=>{const j=l.indexOf(':');if(j>0)c.info[l.slice(0,j).trim()]=l.slice(j+1).trim()});if(!c.id)c.id=slug(c.naam)});
else if(tab=='Fotos')document.querySelectorAll('[data-j]').forEach(r=>{D.FOTOS[r.dataset.j][+r.dataset.i].tekst=$('[data-c]',r).value.trim()});
else if(tab=='Videos')document.querySelectorAll('[data-v]').forEach(b=>{const v=D.VID[+b.dataset.v];v.titel=$('[data-k=titel]',b).value.trim();v.url=$('[data-k=url]',b).value.trim()});
else{const ta=$('#ta');if(!ta)return;const o={},P=tab=='Paklijst';lines(ta.value).forEach(l=>{const p=l.split('|').map(x=>x.trim());if(P){if(p.length>1)(o[p[0]]=o[p[0]]||[]).push(p.slice(1).join(' | '))}else if(p.length>2)(o[p[0]]=o[p[0]]||{})[p[1]]=p.slice(2).join(' | ')});D[P?'PAK':'UIT']=o}}
async function save(){read();D.CAMPINGS=D.CAMPINGS.filter(c=>c.naam);D.VID=D.VID.filter(v=>v.url);toast('Bezig met opslaan...');let n=0;
try{for(const[k,f]of Object.entries(FILES)){const s=JSON.stringify(D[k]);if(s==orig[k])continue;const j=await gh(f,{method:'PUT',body:JSON.stringify({message:'Aangepast via beheer: '+f,content:b64('const '+k+'='+JSON.stringify(D[k],null,1)+';\n'),sha:sha[k],branch:cfg.branch||'main'})});sha[k]=j.content.sha;orig[k]=s;n++}toast(n?'Opgeslagen. Na ongeveer een minuut staat het op de site.':'Er was niets gewijzigd.')}catch(e){toast('Opslaan mislukte: '+e.message)}}
cfg.token?start():setup();
</script></body></html>
